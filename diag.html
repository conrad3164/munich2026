<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic — Munich 2026</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 20px; background: #f6f8fb; color: #1a2230; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #5d6b7d; font-size: 14px; }
  .line { background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
          box-shadow: 0 1px 3px rgba(16,32,55,.1); }
  .line b { display: block; font-size: 13px; text-transform: uppercase;
            letter-spacing: .05em; color: #5d6b7d; margin-bottom: 3px; }
  .ok { border-left: 4px solid #17693c; }
  .ko { border-left: 4px solid #b3261e; }
  .wait { border-left: 4px solid #c8922a; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; }
  fieldset { background: #fff; border: 0; border-radius: 10px; padding: 16px; margin: 20px 0;
             box-shadow: 0 1px 3px rgba(16,32,55,.1); }
  legend { font-weight: 600; padding: 0 6px; }
  input { width: 100%; padding: 11px; margin-bottom: 10px; font-size: 16px;
          border: 1px solid #e4e9ef; border-radius: 8px; box-sizing: border-box; }
  button { padding: 12px 18px; font-size: 15px; font-weight: 600; border: 0;
           border-radius: 8px; background: #0b3b6f; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Diagnostic — Munich 2026</h1>
<p class="sub">Cette page teste chaque brique séparément et affiche le résultat ici même, sans console.</p>

<div id="results"></div>

<fieldset>
  <legend>Test de connexion</legend>
  <input id="email" type="email" placeholder="Adresse e-mail" autocomplete="username">
  <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button id="try" type="button">Tester la connexion et la lecture des données</button>
</fieldset>

<script>
  // Volontairement en script classique (pas un module) : si les modules ES sont
  // le problème, cette page doit quand même s'afficher et le dire.
  var results = document.getElementById("results");

  function line(title, state, message) {
    var id = "t-" + title.replace(/\W/g, "");
    var box = document.getElementById(id);
    if (!box) {
      box = document.createElement("div");
      box.id = id;
      results.appendChild(box);
    }
    box.className = "line " + state;
    box.innerHTML = "<b>" + title + "</b><code></code>";
    box.querySelector("code").textContent = message;
    return box;
  }

  line("Navigateur", "ok", navigator.userAgent);
  line("Modules ES (import dynamique)", "wait", "test en cours…");

  var SDK = "https://www.gstatic.com/firebasejs/12.0.0/";
  // La configuration Firebase n'est pas en clair sur ce site : elle est publiée
  // chiffrée sous le mot de passe du compte, le NAS ne servant plus que de
  // recours. Le diagnostic ne peut donc rien initialiser avant que les
  // identifiants soient saisis, et il teste les deux chemins séparément.
  var CONFIG_BLOB_URL = "./config.enc.json";
  var CONFIG_URL = "https://munich-api.jeppnas.fr/config";
  var mods = {};

  function fromBase64(value) {
    return Uint8Array.from(atob(value), function (c) { return c.charCodeAt(0); });
  }

  // Résout avec la configuration si une entrée du blob s'ouvre, avec null
  // sinon. Volontairement en chaînes de promesses, comme le reste du fichier :
  // une syntaxe trop récente ferait échouer le parsing de toute la page, et
  // c'est précisément quand rien ne marche que cette page doit s'afficher.
  function decryptLocalConfig(password) {
    if (!window.crypto || !crypto.subtle) return Promise.resolve(null);
    return fetch(CONFIG_BLOB_URL, { cache: "no-cache" }).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (blob) {
      if (!blob || !blob.kdf || !Array.isArray(blob.entries)) return null;
      return crypto.subtle.importKey(
        "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
      ).then(function (material) {
        // Le blob ne nomme pas les comptes : on essaie les entrées une à une.
        return blob.entries.reduce(function (chain, entry) {
          return chain.then(function (found) {
            if (found) return found;
            return crypto.subtle.deriveKey(
              { name: "PBKDF2", salt: fromBase64(entry.salt),
                iterations: blob.kdf.iterations, hash: blob.kdf.hash },
              material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
            ).then(function (key) {
              return crypto.subtle.decrypt(
                { name: "AES-GCM", iv: fromBase64(entry.iv) }, key, fromBase64(entry.ct)
              );
            }).then(function (clear) {
              return JSON.parse(new TextDecoder().decode(clear));
            }).catch(function () {
              return null;
            });
          });
        }, Promise.resolve(null));
      });
    }).catch(function () {
      return null;
    });
  }

  function loadModule(url) {
    // import() écrit dans une chaîne évaluée : un Safari trop ancien lèverait
    // une erreur de syntaxe au parsing du fichier entier sinon.
    return new Function("u", "return import(u)")(url);
  }

  loadModule(SDK + "firebase-app.js").then(function (m) {
    mods.app = m;
    line("Modules ES (import dynamique)", "ok", "supportés");
    line("SDK firebase-app.js", "ok", "chargé, initializeApp = " + typeof m.initializeApp);
    return loadModule(SDK + "firebase-auth.js");
  }).then(function (m) {
    mods.auth = m;
    line("SDK firebase-auth.js", "ok", "chargé");
    return loadModule(SDK + "firebase-firestore.js");
  }).then(function (m) {
    mods.store = m;
    line("SDK firebase-firestore.js", "ok", "chargé");
    line("Prêt", "ok", "Saisir les identifiants ci-dessous et lancer le test.");
  }).catch(function (e) {
    line("Échec", "ko", (e && e.message ? e.message : String(e)));
  });

  document.getElementById("try").addEventListener("click", function () {
    if (!mods.store) { line("Test de connexion", "ko", "Les SDK ne sont pas chargés, voir l'erreur ci-dessus."); return; }
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    line("Configuration (dépôt, chiffrée)", "wait", "déchiffrement en cours…");
    decryptLocalConfig(password).then(function (local) {
      if (local) {
        line("Configuration (dépôt, chiffrée)", "ok", "déchiffrée, projet = " + local.projectId);
        return { firebaseConfig: local };
      }
      line("Configuration (dépôt, chiffrée)", "ko",
        "aucune entrée ne s'ouvre avec ce mot de passe (blob absent, ou mot de passe faux)");
      line("Configuration (NAS)", "wait", "recours au NAS, en cours…");
      return fetch(CONFIG_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      }).then(function (r) {
        if (r.status === 401) throw new Error("mot de passe refusé par le NAS (401)");
        if (r.status === 429) throw new Error("trop de tentatives, réessayer dans un quart d'heure (429)");
        if (!r.ok) throw new Error("service de configuration en erreur (" + r.status + ")");
        return r.json();
      }).then(function (d) {
        line("Configuration (NAS)", "ok", "projet = " + d.firebaseConfig.projectId);
        return d;
      });
    }).then(function (d) {
      // initializeApp refuse d'être appelé deux fois : au second essai, on
      // réutilise l'instance déjà créée.
      if (!mods.instance) mods.instance = mods.app.initializeApp(d.firebaseConfig);
      line("Initialisation Firebase", "ok", "domaine d'authentification : " + d.firebaseConfig.authDomain);
      line("Test de connexion", "wait", "en cours…");
      var auth = mods.auth.getAuth(mods.instance);
      return mods.auth.signInWithEmailAndPassword(auth, email, password);
    }).then(function (cred) {
      line("Test de connexion", "ok", "connecté en tant que " + cred.user.email);
      line("Lecture Firestore", "wait", "en cours…");
      var db = mods.store.getFirestore(mods.instance);
      return mods.store.getDoc(mods.store.doc(db, "trip", "plan"));
    }).then(function (snap) {
      if (!snap) return;
      if (!snap.exists()) { line("Lecture Firestore", "ko", "document trip/plan absent"); return; }
      var data = JSON.parse(snap.data().json);
      line("Lecture Firestore", "ok", data.days.length + " jours lus — tout fonctionne.");
    }).catch(function (e) {
      line("Échec", "ko", (e && e.code ? e.code + " — " : "") + (e && e.message ? e.message : String(e)));
    });
  });

  window.addEventListener("error", function (e) {
    line("Erreur JavaScript", "ko", e.message + " (" + (e.filename || "?") + ":" + (e.lineno || "?") + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    line("Promesse rejetée", "ko", String(e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>
</body>
</html>
