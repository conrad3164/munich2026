<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b6f">
<title>Munich 2026</title>
<!-- Le ?v= est incrémenté à chaque publication par private/publish.py : sans lui,
     iOS continue de servir l'ancienne version pendant des jours. -->
<link rel="stylesheet" href="assets/styles.css?v=7">
<!-- Lance le téléchargement des SDK Firebase sans attendre l'analyse d'app.js.
     Ignoré sans dommage par les navigateurs qui ne connaissent pas. -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
</head>
<body>

<div id="screen-login" class="screen">
  <!-- onsubmit="return false" : filet de sécurité. Si le script ne se charge pas,
       le navigateur ne doit surtout pas soumettre le formulaire en GET, ce qui
       mettrait le mot de passe dans l'URL et dans l'historique. -->
  <form id="login-form" class="login-card" autocomplete="on" onsubmit="return false">
    <div class="login-crest">🏰</div>
    <h1>Munich 2026</h1>
    <p class="login-sub">26 août → 4 septembre</p>
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <!-- Désactivé tant que app.js n'a pas fini de charger les SDK Firebase
         (~700 Ko au premier accès) : sinon le clic ne déclenche rien et rien
         ne l'explique. -->
    <button id="login-btn" type="submit" disabled>Chargement…</button>
    <p id="login-error" class="login-error" hidden></p>
  </form>
</div>

<div id="screen-loading" class="screen" hidden>
  <div class="spinner" aria-label="Chargement"></div>
</div>

<div id="screen-app" class="screen app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 id="trip-title">Munich 2026</h1>
        <p id="trip-sub"></p>
      </div>
      <div class="topbar-actions">
        <div id="doc-buttons"></div>
        <button id="logout-btn" class="ghost-btn" type="button">Quitter</button>
      </div>
    </div>
    <nav id="daybar" class="daybar" aria-label="Jours du séjour"></nav>
    <nav id="typebar" class="typebar" aria-label="Filtrer par type de visite"></nav>
  </header>

  <main id="main">
    <section id="day-panel"></section>
  </main>

  <footer class="foot">
    <p id="foot-note"></p>
  </footer>
</div>

<div id="toast" class="toast" hidden></div>

<!-- Journal de diagnostic, visible seulement si l'adresse contient ?debug=1 -->
<pre id="debug" hidden></pre>

<script type="module" src="assets/app.js?v=7"></script>

<!-- Teste instantanément le support des modules ES, sans dépendre du réseau :
     un navigateur trop ancien ignore purement et simplement ce bloc. -->
<script type="module">document.documentElement.dataset.modulesOk = "1";</script>

<script>
  // Sans ce garde-fou, un module qui ne se charge pas (réseau coupé, bloqueur de
  // publicité qui filtre gstatic.com) laisse une page muette : le bouton ne
  // réagit pas et rien n'explique pourquoi.
  function showLoginError(text) {
    var box = document.getElementById("login-error");
    if (!box) return;
    box.textContent = text;
    box.hidden = false;
  }

  // 25 s, pas 8 : les trois SDK Firebase pèsent ~700 Ko au premier accès, et un
  // délai trop court transformait un chargement lent en fausse alerte.
  setTimeout(function () {
    if (document.documentElement.dataset.appReady) return;
    if (!document.documentElement.dataset.modulesOk) {
      showLoginError("Ce navigateur ne gère pas les modules JavaScript. " +
        "Utiliser une version récente de Safari, Chrome ou Firefox.");
      return;
    }
    showLoginError(
      "Le chargement dure anormalement longtemps. Causes possibles : réseau très lent, " +
      "ou un bloqueur de publicité qui filtre gstatic.com. La page diag.html teste chaque brique."
    );
  }, 25000);

  // Une erreur qui n'apparaît que dans la console est invisible sur mobile :
  // on la remonte aussi à l'écran.
  window.addEventListener("error", function (e) {
    showLoginError("Erreur : " + (e.message || "chargement impossible") +
      (e.filename ? " (" + e.filename + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    showLoginError("Erreur : " + (r && r.message ? r.message : String(r)));
  });

  // Service worker : rend le site consultable hors ligne et, surtout, reprend la
  // main sur le cache de l'icône d'écran d'accueil iOS, qui sert sinon une
  // version figée pendant des jours. Quand une nouvelle version prend la main,
  // la page se recharge une seule fois.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js")
        .then(function (registration) { registration.update(); })
        .catch(function (e) { console.warn("service worker non enregistré :", e); });

      var reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
